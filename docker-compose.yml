services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: track_faster_development
    volumes:
      - postgres-data:/var/lib/postgresql/
    ports:
      - 5432:5432

  web:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./public
          target: /track_faster/public
        - action: sync+restart
          path: ./app
          target: /track_faster/app
        - action: rebuild
          path: Gemfile
    ports:
      - "9292:9292"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/track_faster_development

volumes:
  postgres-data:
